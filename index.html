<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starry Night Interactive Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-root:   #0d0d1a;
  --bg-panel:  #12121f;
  --bg-header: #191930;
  --bg-canvas: #070710;
  --accent:    #00dcff;
  --text:      #e8f0ff;
  --muted:     #7080a0;
  --border:    #222238;
  --ok:        #80e080;
  --err:       #ff5555;
  --btn-bg:    #1a1a38;
  --btn-ho:    #28285a;
}

body {
  background: var(--bg-root);
  color: var(--text);
  font-family: 'Consolas', 'D2Coding', monospace;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

#dashboard {
  display: grid;
  grid-template-columns: 4fr 1fr;
  gap: 8px;
  padding: 8px;
  height: 100vh;
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-header {
  background: var(--bg-header);
  color: var(--accent);
  font-size: 10.5px;
  font-weight: bold;
  letter-spacing: 0.06em;
  padding: 6px 12px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

/* ── Left panel ──────────────────────────────────────────────────────────── */
#panel-left { grid-row: 1; grid-column: 1; }

.panel-body {
  display: flex;
  flex-direction: column;
  padding: 10px;
  flex: 1;
  min-height: 0;
}

#btn-upload {
  background: var(--btn-bg);
  color: var(--accent);
  border: 1px solid var(--border);
  padding: 8px 14px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  border-radius: 3px;
  transition: background 0.12s;
  flex-shrink: 0;
}
#btn-upload:hover { background: var(--btn-ho); }
#file-input { display: none; }

#fname {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin: 5px 0 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 0;
}

#img-container {
  flex: 1;
  background: var(--bg-canvas);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  min-height: 0;
}

#img-canvas { width: 100%; height: 100%; display: block; }

#open-bar-wrap {
  flex-shrink: 0;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
#open-label { font-size: 9px; color: var(--muted); white-space: nowrap; }
#open-track {
  flex: 1; height: 4px;
  background: #1a1a30;
  border-radius: 2px;
  overflow: hidden;
}
#open-fill {
  height: 100%; width: 0%;
  border-radius: 2px;
  background: linear-gradient(to right, #4050ff, #00dcff);
  transition: width 0.05s linear;
}

/* ── Right column ────────────────────────────────────────────────────────── */
#panel-right {
  grid-column: 2;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 8px;
  min-height: 0;
}

#panel-camera { min-height: 0; }

#camera-wrap {
  position: relative;
  background: #000;
  overflow: hidden;
  width: 100%;
  aspect-ratio: 16 / 9;
}

#webcam {
  position: absolute;
  inset: 0; width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

#overlay {
  position: absolute;
  inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}

.badge {
  position: absolute;
  font-size: 10.5px; font-weight: bold;
  padding: 3px 9px; border-radius: 3px;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(2px);
}
#fps-badge    { top: 8px; left: 8px;  color: var(--accent); }
#status-badge { top: 8px; right: 8px; color: var(--err); }
.status-ok  { color: var(--ok)  !important; }
.status-bad { color: var(--err) !important; }

#no-cam-msg {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); font-size: 12px;
  line-height: 2.2; text-align: center;
}
#no-cam-msg strong { color: var(--err); font-size: 13px; }

#panel-info { min-height: 0; }

#info-body {
  flex: 1; overflow-y: auto;
  padding: 5px 10px 6px; min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: #333355 var(--bg-root);
}
#info-body::-webkit-scrollbar       { width: 5px; }
#info-body::-webkit-scrollbar-track { background: var(--bg-root); }
#info-body::-webkit-scrollbar-thumb { background: #333355; border-radius: 3px; }

#info-text {
  font-family: 'Consolas', 'D2Coding', monospace;
  font-size: 10.5px; line-height: 1.6; white-space: pre;
}

.c-log   { color: var(--muted); }
.c-err   { color: var(--err);   }
.c-ok    { color: var(--ok);    }
.c-hdr   { color: var(--accent);}
.c-tip   { color: #00dcff; }
.c-base  { color: #78dc78; }
.c-wrist { color: #50b4ff; }
.c-other { color: #dcdcdc; }
.divider { color: #2a2a44; }
</style>
</head>
<body>

<div id="dashboard">

  <div id="panel-left" class="panel">
    <div class="panel-header">  IMAGE  —  WEBGL FLUID INTERACTION (STARRY NIGHT)</div>
    <div class="panel-body">
      <button id="btn-upload">  Load Custom Image…</button>
      <input  id="file-input" type="file" accept="image/*">
      <span   id="fname">Loading...</span>
      <div    id="img-container">
        <canvas id="img-canvas"></canvas>
      </div>
      <div id="open-bar-wrap">
        <span id="open-label">HAND OPENNESS  0%</span>
        <div  id="open-track"><div id="open-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="panel-right">
    <div id="panel-camera" class="panel">
      <div class="panel-header">  HAND TRACKING  —  LIVE CAMERA</div>
      <div id="camera-wrap">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="fps-badge"    class="badge">-- fps</div>
        <div id="status-badge" class="badge status-bad">NO HAND</div>
        <div id="no-cam-msg">
          <strong>Camera unavailable</strong>
          로컬 서버로 열어주세요:<br>
          <span style="color:var(--accent)">python -m http.server 8080</span>
        </div>
      </div>
    </div>

    <div id="panel-info" class="panel">
      <div class="panel-header">  JOINT DATA  /  SYSTEM LOG</div>
      <div id="info-body">
        <div id="info-text"><span class="c-log">Initializing…</span></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── Constants ────────────────────────────────────────────────────────────────
const JOINT_NAMES = [
  "WRIST",
  "THUMB_CMC","THUMB_MCP","THUMB_IP",  "THUMB_TIP",
  "INDEX_MCP","INDEX_PIP","INDEX_DIP", "INDEX_TIP",
  "MIDDLE_MCP","MIDDLE_PIP","MIDDLE_DIP","MIDDLE_TIP",
  "RING_MCP", "RING_PIP", "RING_DIP",  "RING_TIP",
  "PINKY_MCP","PINKY_PIP","PINKY_DIP", "PINKY_TIP",
];
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17],
];
const TIPS  = new Set([4, 8, 12, 16, 20]);
const BASES = new Set([5, 9, 13, 17]);

// 위키백과 파일 페이지의 직접 이미지 링크로 기본값 설정
const DEFAULT_IMG = "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1200px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg";

// ── DOM refs ─────────────────────────────────────────────────────────────────
const webcam      = document.getElementById('webcam');
const overlay     = document.getElementById('overlay');
const fpsBadge    = document.getElementById('fps-badge');
const statusBadge = document.getElementById('status-badge');
const infoText    = document.getElementById('info-text');
const infoBody    = document.getElementById('info-body');
const fnameEl     = document.getElementById('fname');
const fileInput   = document.getElementById('file-input');
const noCamMsg    = document.getElementById('no-cam-msg');
const imgCanvas   = document.getElementById('img-canvas');
const openFill    = document.getElementById('open-fill');
const openLabel   = document.getElementById('open-label');

const ctx  = overlay.getContext('2d');

// ── State ────────────────────────────────────────────────────────────────────
let smoothOpen  = 0.0;
let targetOpen  = 0.0;
let handPresent = false;

// ── Logging ──────────────────────────────────────────────────────────────────
const logBuf = [];
function log(text, cls = 'c-log') {
  logBuf.push(`<span class="${cls}">${text}</span>`);
  if (logBuf.length > 80) logBuf.shift();
}
function flushLog() {
  infoText.innerHTML = logBuf.join('\n');
  infoBody.scrollTop = 99999;
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function jColor(i) {
  if (TIPS.has(i))  return '#00dcff';
  if (BASES.has(i)) return '#78dc78';
  if (i === 0)      return '#50b4ff';
  return '#dcdcdc';
}
function jClass(i) {
  if (TIPS.has(i))  return 'c-tip';
  if (BASES.has(i)) return 'c-base';
  if (i === 0)      return 'c-wrist';
  return 'c-other';
}

// ── WebGL Setup ─────────────────────────────────────────────────────────────
const gl = imgCanvas.getContext('webgl');
if (!gl) { log('[ERROR] WebGL을 지원하지 않는 브라우저입니다.', 'c-err'); flushLog(); }

// Vertex Shader: 화면을 덮는 사각형(Quad) 렌더링 및 UV 좌표 전달
const vsSource = `
  attribute vec2 a_position;
  attribute vec2 a_texcoord;
  varying vec2 v_texcoord;
  void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
    v_texcoord = a_texcoord;
  }
`;

// Fragment Shader: 손 좌표를 중심으로 유화 물감이 흐르듯 픽셀 왜곡(Distortion) 처리
const fsSource = `
  precision mediump float;
  varying vec2 v_texcoord;
  
  uniform sampler2D u_image;
  uniform vec2 u_pointer;       // 손가락 위치 (0.0 ~ 1.0)
  uniform float u_aspect;       // 화면 비율 (Width / Height)
  uniform float u_strength;     // 효과 강도 (손이 있을 때 1.0으로 부드럽게 증가)
  uniform float u_openness;     // 손가락 폄 정도 (0.0 주먹, 1.0 보자기)
  
  uniform vec2 u_resolution;    // 캔버스 해상도
  uniform vec2 u_texResolution; // 텍스처(이미지) 원본 해상도

  void main() {
    vec2 uvCanvas = v_texcoord;
    
    // 1. 왜곡 효과 적용 (Canvas UV 기준)
    vec2 diff = uvCanvas - u_pointer;
    diff.x *= u_aspect; // 원형 유지를 위한 비율 보정
    float dist = length(diff);
    
    // 왜곡이 미치는 반경 (화면의 약 35%)
    float radius = 0.35;
    
    if (dist < radius) {
      // 거리에 따른 감쇠 (가운데일수록 강하게)
      float falloff = smoothstep(radius, 0.0, dist);
      float ease = pow(falloff, 1.5);
      
      // 회전(소용돌이) 강도: 주먹 쥘수록(openness 낮음) 더 강하게 휘감김
      float swirlAmt = mix(6.0, 1.0, u_openness) * ease * u_strength;
      float s = sin(swirlAmt);
      float c = cos(swirlAmt);
      mat2 rot = mat2(c, -s, s, c);
      
      diff = rot * diff;
      
      // 돌출/수축 강도: 주먹 쥐면 안으로 빨려가고(-), 펼치면 밀어냄(+)
      float bulgeAmt = mix(-0.15, 0.10, u_openness) * ease * u_strength;
      diff += normalize(diff) * bulgeAmt;
    }
    
    diff.x /= u_aspect; // 비율 보정 원복
    uvCanvas = u_pointer + diff;
    
    // 2. CSS object-fit: contain 효과 (이미지가 잘리지 않고 전체가 보이도록 수정)
    vec2 s = u_resolution;
    vec2 i = u_texResolution;
    
    // 캔버스 안에 텍스처를 맞추기 위한 축소 비율 계산
    float scale = min(s.x / i.x, s.y / i.y);
    vec2 renderSize = i * scale;
    
    // UV 좌표 변환 (중앙 정렬)
    vec2 uvTex = (uvCanvas * s - (s - renderSize) * 0.5) / renderSize;
    
    // 캔버스의 남는 여백(Letterbox) 처리: 텍스처 범위를 벗어나면 배경색 출력
    if (uvTex.x < 0.0 || uvTex.x > 1.0 || uvTex.y < 0.0 || uvTex.y > 1.0) {
      gl_FragColor = vec4(0.027, 0.027, 0.063, 1.0); // #070710
      return;
    }
    
    // 색상 출력
    gl_FragColor = texture2D(u_image, uvTex);
  }
`;

function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}

const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
const program = gl.createProgram();
gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);
gl.linkProgram(program);

// 속성 및 유니폼 위치 매핑
const aPositionLoc = gl.getAttribLocation(program, "a_position");
const aTexcoordLoc = gl.getAttribLocation(program, "a_texcoord");
const uPointerLoc = gl.getUniformLocation(program, "u_pointer");
const uAspectLoc = gl.getUniformLocation(program, "u_aspect");
const uStrengthLoc = gl.getUniformLocation(program, "u_strength");
const uOpennessLoc = gl.getUniformLocation(program, "u_openness");
const uResolutionLoc = gl.getUniformLocation(program, "u_resolution");
const uTexResolutionLoc = gl.getUniformLocation(program, "u_texResolution");

// 버퍼 생성 (Quad)
const positionBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1,  1,   // top left
  -1, -1,   // bottom left
   1,  1,   // top right
   1, -1    // bottom right
]), gl.STATIC_DRAW);

const texcoordBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, texcoordBuffer);
// HTML Canvas 좌표계(Top-Left: 0,0)에 맞게 텍스처 좌표 할당
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
   0,  0,
   0,  1,
   1,  0,
   1,  1
]), gl.STATIC_DRAW);

// 텍스처 초기화
const texture = gl.createTexture();
let imageLoaded = false;
let texWidth = 1, texHeight = 1;

function loadImage(src, name) {
  const img = new Image();
  img.crossOrigin = "anonymous"; // 외부 URL(Wikimedia) 접근용 CORS 허용
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    
    imageLoaded = true;
    texWidth = img.width;
    texHeight = img.height;
    
    const short = name.length > 40 ? name.slice(0, 38) + '…' : name;
    fnameEl.textContent = short;
    log(`[WebGL] 이미지 텍스처 업로드 완료: ${short}`, 'c-log');
    flushLog();
  };
  img.onerror = () => {
    log(`[ERROR] 이미지 로드 실패 (CORS 등). 로컬 이미지를 업로드해보세요.`, 'c-err');
    flushLog();
  };
  img.src = src;
}

document.getElementById('btn-upload').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) loadImage(URL.createObjectURL(f), f.name);
});
loadImage(DEFAULT_IMG, "Van_Gogh_Starry_Night.jpg");

// ── WebGL Render Loop 변수 ───────────────────────────────────────────────────
let curPointer = { x: 0.5, y: 0.5 };
let tarPointer = { x: 0.5, y: 0.5 };
let curStrength = 0.0;

function renderWebGL(ts) {
  const cw = imgCanvas.offsetWidth;
  const ch = imgCanvas.offsetHeight;
  if (cw < 1 || ch < 1) return;
  
  if (imgCanvas.width !== cw || imgCanvas.height !== ch) {
    imgCanvas.width = cw;
    imgCanvas.height = ch;
    gl.viewport(0, 0, cw, ch);
  }

  if (!imageLoaded) {
    // 배경만 검정으로 지움
    gl.clearColor(0.04, 0.04, 0.06, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return;
  }

  gl.useProgram(program);

  // 상호작용 부드러운 보간 처리 (선형 보간 - LERP)
  if (handPresent) {
    curPointer.x += (tarPointer.x - curPointer.x) * 0.15;
    curPointer.y += (tarPointer.y - curPointer.y) * 0.15;
    curStrength  += (1.0 - curStrength) * 0.08;
  } else {
    curStrength  += (0.0 - curStrength) * 0.05;
  }

  // Uniform 값 전송
  gl.uniform2f(uPointerLoc, curPointer.x, curPointer.y);
  gl.uniform1f(uAspectLoc, cw / ch);
  gl.uniform1f(uStrengthLoc, curStrength);
  gl.uniform1f(uOpennessLoc, smoothOpen);
  gl.uniform2f(uResolutionLoc, cw, ch);
  gl.uniform2f(uTexResolutionLoc, texWidth, texHeight);

  // 드로우
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.vertexAttribPointer(aPositionLoc, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aPositionLoc);

  gl.bindBuffer(gl.ARRAY_BUFFER, texcoordBuffer);
  gl.vertexAttribPointer(aTexcoordLoc, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aTexcoordLoc);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ── Openness detection ────────────────────────────────────────────────────────
// Returns 0.0 (fist) … 1.0 (fully open) based on fingertip distances from wrist.
function calcOpenness(lms) {
  const wrist   = lms[0];
  const palmRef = lms[9];
  const palmSz  = Math.hypot(palmRef.x - wrist.x, palmRef.y - wrist.y);
  if (palmSz < 0.01) return smoothOpen;

  let sum = 0;
  for (const id of [8, 12, 16, 20])
    sum += Math.hypot(lms[id].x - wrist.x, lms[id].y - wrist.y);

  return Math.max(0, Math.min(1, (sum / 4 / palmSz - 1.0) / 1.5));
}


// ── MediaPipe init ────────────────────────────────────────────────────────────
let detector = null, lastVideoTime = -1;
let fps = 0, lastTs = 0;

log('[INFO ] MediaPipe tasks-vision 로드 중…');
flushLog();

async function init() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  detector = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/" +
        "hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence:  0.5,
    minTrackingConfidence:      0.5,
  });
  log('[INFO ] 인공지능 모델 로드 완료 ✓');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
    });
    webcam.srcObject = stream;
    webcam.addEventListener('loadeddata', () => {
      log('[INFO ] 카메라 준비 완료 ✓');
      log(`[INFO ] ✊ 주먹 → 물감을 강하게 뒤섞음 (Swirl)`);
      log(`[INFO ] ✋ 펴기 → 물감을 밖으로 밀어냄 (Push)`);
      flushLog();
      requestAnimationFrame(loop);
    });
  } catch (err) {
    log(`[ERROR] 카메라: ${err.message}`, 'c-err');
    log('[HINT ] python -m http.server 8080 → localhost:8080 으로 실행', 'c-hdr');
    noCamMsg.style.display = 'flex';
    flushLog();
    requestAnimationFrame(loop);
  }
}

// ── Main render loop ──────────────────────────────────────────────────────────
function loop(ts) {
  const dt = ts - lastTs || 16;
  lastTs = ts;
  fps    = fps * 0.88 + (1000 / dt) * 0.12;
  fpsBadge.textContent = `${fps.toFixed(1)} fps`;

  // Hand detection
  if (detector && webcam.readyState >= 2 && webcam.currentTime !== lastVideoTime) {
    lastVideoTime = webcam.currentTime;

    const dw = webcam.offsetWidth, dh = webcam.offsetHeight;
    if (overlay.width !== dw || overlay.height !== dh) {
      overlay.width = dw; overlay.height = dh;
    }

    const result = detector.detectForVideo(webcam, ts);
    ctx.clearRect(0, 0, dw, dh);

    if (result.landmarks.length > 0) {
      const lms  = result.landmarks[0];
      handPresent = true;
      targetOpen  = calcOpenness(lms);
      
      // 🖐️ 상호작용 핵심 지표: 검지 손가락 끝(Landmark 8) 기준
      // 중요: 웹캠은 transform: scaleX(-1)로 반전되어 있으므로, X좌표를 반전시켜야 화면 상의 거울상과 동기화됨.
      tarPointer.x = 1.0 - lms[8].x;
      tarPointer.y = lms[8].y;

      drawSkeleton(lms, dw, dh);
      renderJoints(lms, webcam.videoWidth, webcam.videoHeight);
      statusBadge.textContent = targetOpen < 0.35 ? '✊ GRIP' : '✋ OPEN';
      statusBadge.className   = 'badge status-ok';
    } else {
      handPresent = false;
      renderWaiting();
      statusBadge.textContent = 'NO HAND';
      statusBadge.className   = 'badge status-bad';
    }
  }

  // Smooth openness easing
  const ease  = handPresent ? 0.075 : 0.030;
  smoothOpen += (targetOpen - smoothOpen) * ease;

  // Openness bar UI update
  const pct = Math.round(smoothOpen * 100);
  openFill.style.width  = pct + '%';
  openLabel.textContent = `HAND OPENNESS  ${pct}%`;

  // WebGL Renderer 호출
  renderWebGL(ts);

  requestAnimationFrame(loop);
}

// ── Skeleton ──────────────────────────────────────────────────────────────────
function drawSkeleton(lms, w, h) {
  const mx = lm => (1 - lm.x) * w;
  const my = lm => lm.y * h;
  ctx.strokeStyle = '#a0a0a0'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const [s, e] of CONNECTIONS) {
    ctx.beginPath();
    ctx.moveTo(mx(lms[s]), my(lms[s]));
    ctx.lineTo(mx(lms[e]), my(lms[e]));
    ctx.stroke();
  }
  for (let i = 0; i < lms.length; i++) {
    const x = mx(lms[i]), y = my(lms[i]);
    const r = TIPS.has(i) ? 8 : 5;
    const c = jColor(i);
    ctx.fillStyle = 'rgba(5,5,10,0.85)';
    ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    
    // 검지 끝부분(8번) 강조 마커
    if (i === 8) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r + 4, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.fillStyle = c;
    ctx.font = 'bold 11px Consolas, monospace';
    ctx.fillText(String(i), x + 10, y - 6);
  }
}

// ── Info panel ────────────────────────────────────────────────────────────────
function renderJoints(lms, fw, fh) {
  const parts = [];
  parts.push(`<span class="c-ok">  STATUS  HAND DETECTED     </span>`
           + `<span class="c-log">CAMERA ${fw}×${fh}</span>\n`);
  parts.push(`<span class="c-hdr">  ${'#'.padEnd(4)} ${'NAME'.padEnd(13)} ${'NX'.padStart(7)} ${'NY'.padStart(7)} ${'NZ'.padStart(8)}   ${'PX'.padStart(5)} ${'PY'.padStart(5)}</span>\n`);
  parts.push(`<span class="divider">  ${'─'.repeat(56)}</span>\n`);
  for (let i = 0; i < lms.length; i++) {
    const lm = lms[i];
    const px = Math.round(lm.x * fw), py = Math.round(lm.y * fh);
    parts.push(`<span class="${jClass(i)}">  ${String(i).padStart(2,'0')}   ${JOINT_NAMES[i].padEnd(13)} ${lm.x.toFixed(4).padStart(7)} ${lm.y.toFixed(4).padStart(7)} ${lm.z.toFixed(5).padStart(8)}   ${String(px).padStart(5)} ${String(py).padStart(5)}</span>\n`);
  }
  infoText.innerHTML = parts.join('');
}

function renderWaiting() {
  infoText.innerHTML = logBuf.slice(-14).join('\n')
    + '\n<span class="c-log">  화면에 손을 보여주세요 (검지 끝 추적)…</span>';
  infoBody.scrollTop = 99999;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
init().catch(err => {
  log(`[ERROR] ${err}`, 'c-err');
  flushLog();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
